name: CI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Check required site files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          grep -q '<title>' index.html
