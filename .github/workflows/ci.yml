name: CI checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React app
    runs-on: ubuntu-latest
    steps:
      - name: Show runner resources
        run: |
          echo "CPU:"
          nproc
          echo "RAM:"
          free -h
          echo "Disk:"
          df -h /
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source code
        run: npm run lint

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

      - name: Validate translation files
        run: npm run i18n:check

      - name: Build production bundle
        run: npm run build

      - name: Build Docker image
        run: docker build --tag cicd-learning-journal:${{ github.sha }} .

      - name: Smoke test Docker container
        run: |
          docker run --detach --name cicd-smoke-test --publish 8080:80 cicd-learning-journal:${{ github.sha }}
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error http://localhost:8080/ && exit 0
            sleep 2
          done
          docker logs cicd-smoke-test
          exit 1

      - name: Clean up Docker container
        if: always()
        run: docker rm --force cicd-smoke-test || true
