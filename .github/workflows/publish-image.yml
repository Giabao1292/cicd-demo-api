name: Deploy frontend artifact to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  build:
    name: Build deployable artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and lint
        run: |
          npm run lint
          npm test
          npm run i18n:check

      - name: Build production bundle
        run: npm run build

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy artifact with Nginx
    needs: build
    # This runner is the EC2 instance itself. Keep this job off pull_request
    # workflows so untrusted code never executes on the server.
    runs-on: [self-hosted, linux, x64, cicd-ec2]
    steps:
      - name: Download the artifact built for this commit
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist-${{ github.sha }}
          path: artifact

      - name: Atomically point Nginx at the new release
        run: |
          release_dir="/var/www/cicd-learning-journal/releases/${GITHUB_SHA}"
          sudo install -d -m 0755 "$release_dir"
          sudo cp -a artifact/. "$release_dir/"
          sudo ln -sfn "$release_dir" /var/www/cicd-learning-journal/current
          sudo nginx -t
          sudo systemctl reload nginx
