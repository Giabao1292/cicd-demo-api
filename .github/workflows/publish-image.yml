name: Deploy frontend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

# Credentials are obtained through GitHub OIDC. Do not add long-lived AWS keys
# to repository secrets.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

env:
  ECR_REPOSITORY: cicd-learning-journal
  EC2_INSTANCE_TAG_KEY: cicd-learning-journal
  EC2_INSTANCE_TAG_VALUE: frontend

jobs:
  deploy:
    name: Build, publish, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # This lab targets an x86_64 EC2 instance.
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Ask the tagged EC2 instance to deploy the immutable image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:${EC2_INSTANCE_TAG_KEY},Values=${EC2_INSTANCE_TAG_VALUE}" \
            --comment "Deploy ${IMAGE_URI}" \
            --parameters "commands=[\"/opt/cicd-learning-journal/deploy.sh '${IMAGE_URI}' '${AWS_REGION}'\"]" \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM command: ${command_id}"
          aws ssm wait command-executed \
            --command-id "${command_id}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"
