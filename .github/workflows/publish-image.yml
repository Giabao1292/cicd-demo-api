name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow receives a short-lived GitHub token; no Docker password is stored.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      # GitHub runners are AMD64. QEMU lets Buildx also produce an ARM64
      # variant for Docker Desktop on Apple Silicon.
      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
