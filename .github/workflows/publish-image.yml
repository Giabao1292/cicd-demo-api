name: Deploy frontend artifact to EC2

on:
  push:
    branches: [main]
    # A version tag is a deliberate production release. For example, creating
    # v1.0.1 deploys an EC2 release named v1.0.1 rather than only a SHA.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  build:
    name: Build deployable artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and lint
        run: |
          npm run lint
          npm test
          npm run i18n:check

      - name: Build production bundle
        # Vite defaults to the GitHub Pages path in vite.config.js. EC2 Nginx
        # serves this artifact at its domain root instead.
        run: VITE_BASE_PATH=/ npm run build

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy artifact with Nginx
    needs: build
    # This runner is the EC2 instance itself. Keep this job off pull_request
    # workflows so untrusted code never executes on the server.
    runs-on: [self-hosted, linux, x64, cicd-ec2]
    steps:
      - name: Download the artifact built for this commit
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist-${{ github.sha }}
          path: artifact

      - name: Atomically point Nginx at the new release
        run: |
          set -euo pipefail

          if test "$GITHUB_REF_TYPE" = "tag"; then
            release_id="$GITHUB_REF_NAME"
            # Keep release directory names safe and predictable. This accepts
            # versions such as v1.0.1 and v1.2.0-rc.1.
            [[ "$release_id" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          else
            release_id="$GITHUB_SHA"
          fi

          release_dir="/var/www/cicd-learning-journal/releases/$release_id"
          if test "$GITHUB_REF_TYPE" = "tag" && test -e "$release_dir"; then
            echo "Refusing to overwrite existing versioned release: $release_id" >&2
            exit 1
          fi
          sudo install -d -m 0755 "$release_dir"
          sudo cp -a artifact/. "$release_dir/"
          printf '%s\n' "$GITHUB_SHA" | sudo tee "$release_dir/COMMIT_SHA" >/dev/null
          printf '%s\n' "$release_id" | sudo tee "$release_dir/RELEASE_ID" >/dev/null
          sudo ln -sfn "$release_dir" /var/www/cicd-learning-journal/current
          sudo nginx -t
          sudo systemctl reload nginx
