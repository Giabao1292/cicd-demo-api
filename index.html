<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trang demo GitHub Actions và GitHub Pages." />
    <title>Pipeline Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">CI/CD · GITHUB ACTIONS</p>
      <h1>Một lần <em>push</em>,<br />một bản deploy mới.</h1>
      <p class="intro">Đây là frontend tĩnh được tự động kiểm tra và xuất bản bằng GitHub Actions + GitHub Pages.</p>

      <section class="pipeline" aria-label="Các bước pipeline">
        <article><span>01</span><strong>Push</strong><small>Bạn thay đổi code</small></article>
        <i aria-hidden="true">→</i>
        <article><span>02</span><strong>Check</strong><small>Actions kiểm tra site</small></article>
        <i aria-hidden="true">→</i>
        <article><span>03</span><strong>Deploy</strong><small>Pages được cập nhật</small></article>
      </section>

      <button id="celebrate" type="button">Chạy một thay đổi nhỏ <span>↗</span></button>
      <p id="message" aria-live="polite"></p>
    </main>
    <footer>Lab CI/CD · <span id="year"></span></footer>
    <script src="app.js"></script>
  </body>
</html>
