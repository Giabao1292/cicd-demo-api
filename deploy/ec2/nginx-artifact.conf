server {
  listen 80 default_server;
  server_name _;

  root /var/www/cicd-learning-journal/current;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
